name: Сборка Frontline-unsigned.ipa в 1 клик (ФРОНТЛАЙН v2.4)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Конфигурация сборки (Release / Debug)"
        required: false
        default: "Release"
  push:
    branches:
      - main
      - master
      - "**"

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-ipa:
    name: Автосборка Frontline-unsigned.ipa (macOS arm64)
    runs-on: macos-15
    steps:
      - name: 1. Checkout репозитория
        uses: actions/checkout@v4

      - name: 2. Авто-распаковка всех исходников v2.4 (работает даже из 1 этого файла!)
        env:
          PAYLOAD_B64: ""
        run: |
          if [ -f "Frontline-iOS-GitHub-Repo.zip" ]; then
            unzip -oq Frontline-iOS-GitHub-Repo.zip
          fi
          python3 -c 'import base64,json,os,zlib; d=json.loads(zlib.decompress(base64.b64decode(os.environ["PAYLOAD_B64"])).decode("utf-8")); [(os.makedirs(os.path.dirname(p),exist_ok=True), open(p,"w",encoding="utf-8").write(c), print("Создан:", p)) for p,c in d.items() if not os.path.exists(p)]; os.chmod("scripts/validate_ipa.sh",0o755)'

      - name: 3. Выбор последней стабильной версии Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          STABLE_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | grep -vE "beta|preview|RC" | sort -V | tail -n 1 || true)
          if [ -n "$STABLE_XCODE" ]; then
            echo "Выбираем стабильный Xcode: $STABLE_XCODE"
            sudo xcode-select -s "$STABLE_XCODE"
          fi
          xcodebuild -version
          swift --version

      - name: 4. Установка XcodeGen
        run: |
          command -v xcodegen >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: 5. Генерация иконки 1024x1024 RGB (без альфа-канала)
        run: |
          python3 scripts/generate_icon.py ios-native/Resources/Assets.xcassets/AppIcon.appiconset/Icon-1024.png

      - name: 6. Прогон юнит-тестов (GameCore)
        working-directory: ios-native
        run: |
          swift test

      - name: 7. Генерация Frontline.xcodeproj через XcodeGen
        working-directory: ios-native
        run: |
          sed -i "" "s/__BUILD_NUMBER__/${GITHUB_RUN_NUMBER:-1}/g" project.yml
          xcodegen generate

      - name: 8. Сборка Release arm64 без подписи (xcodebuild)
        working-directory: ios-native
        run: |
          xcodebuild build \
            -project Frontline.xcodeproj \
            -scheme Frontline \
            -configuration "${{ github.event.inputs.configuration || 'Release' }}" \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: 9. Упаковка Payload/Frontline.app в Frontline-unsigned.ipa
        working-directory: ios-native
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products -name "Frontline.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ОШИБКА: Frontline.app не найден!"
            exit 1
          fi
          rm -rf Payload Frontline-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Frontline.app
          rm -rf Payload/Frontline.app/_CodeSignature Payload/Frontline.app/embedded.mobileprovision
          zip -qry Frontline-unsigned.ipa Payload

      - name: 10. Валидация Frontline-unsigned.ipa
        run: |
          chmod +x scripts/validate_ipa.sh
          ./scripts/validate_ipa.sh ios-native/Frontline-unsigned.ipa

      - name: 11. Загрузка Frontline-unsigned.ipa в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Frontline-unsigned-ipa
          path: ios-native/Frontline-unsigned.ipa
          retention-days: 30

      - name: 12. Публикация готового .IPA в GitHub Releases (прямая ссылка для iPhone)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_TAG="v2.4.${GITHUB_RUN_NUMBER}"
          NOTES="## ФРОНТЛАЙН v2.4 — Сборка #${GITHUB_RUN_NUMBER} (${VERSION_TAG})
          - **Готовый файл для установки на iPhone**: \`Frontline-unsigned.ipa\` (arm64, iOS 16.0+, без подписи — подпишите своим сертификатом в Feather / ESign / Sideloadly / AltStore).
          - **Прямая ссылка для скачивания в Safari**: \`https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Frontline-unsigned.ipa\`"

          gh release create "$VERSION_TAG" ios-native/Frontline-unsigned.ipa \
            --title "ФРОНТЛАЙН ${VERSION_TAG}" \
            --notes "$NOTES" || true

          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest ios-native/Frontline-unsigned.ipa \
            --title "ФРОНТЛАЙН — Скачать свежий .IPA (Latest)" \
            --notes "$NOTES" || true
