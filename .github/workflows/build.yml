name: Build Unsigned iOS IPA (One-Click Self-Contained v3.0)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Конфигурация сборки (Release или Debug)"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
  push:
    branches:
      - main
      - master

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  APP_NAME: Frontline
  SCHEME_NAME: Frontline

jobs:
  build-unsigned-ipa:
    name: Сборка неподписанного Frontline-unsigned.ipa (v3.0)
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: 1. Автономная распаковка всех исходников игры (v3.0 · 20 стволов)
        env:
          PAYLOAD_B64: ""
        run: |
          set -euo pipefail
          python3 -c "import os, json, zlib, base64; data = json.loads(zlib.decompress(base64.b64decode(os.environ['PAYLOAD_B64'])).decode('utf-8')); [os.makedirs(os.path.dirname(p), exist_ok=True) or open(p, 'w', encoding='utf-8').write(c) for p, c in data.items()]; print('Распаковано файлов:', len(data))"
          ls -la ios-native

      - name: 2. Проверка версии Xcode и инструментов
        run: |
          xcodebuild -version
          swift --version
          which xcodegen || brew install xcodegen

      - name: 3. Запуск модульных тестов ядра (SwiftPM GameCore — 20 стволов)
        working-directory: ios-native
        run: |
          swift test --parallel

      - name: 4. Генерация проекта Frontline.xcodeproj (XcodeGen)
        working-directory: ios-native
        run: |
          xcodegen generate
          ls -la Frontline.xcodeproj

      - name: 5. Архивация iOS-приложения (Generic iOS Device, arm64, без подписи)
        working-directory: ios-native
        run: |
          CONFIG="${{ github.event.inputs.configuration || 'Release' }}"
          xcodebuild archive \
            -project Frontline.xcodeproj \
            -scheme "$SCHEME_NAME" \
            -configuration "$CONFIG" \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Frontline.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: 6. Упаковка Payload и проверка структуры Frontline-unsigned.ipa
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/Frontline.xcarchive/Products/Applications/Frontline.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ОШИБКА: Frontline.app не найден по пути $APP_PATH"
            exit 1
          fi

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/Frontline.app"

          rm -rf "$RUNNER_TEMP/Payload/Frontline.app/_CodeSignature"
          rm -f "$RUNNER_TEMP/Payload/Frontline.app/embedded.mobileprovision"

          cd "$RUNNER_TEMP"
          zip -qry Frontline-unsigned.ipa Payload

          echo "=== ПРОВЕРКА АРХИВА .IPA ==="
          ls -lh "$RUNNER_TEMP/Frontline-unsigned.ipa"
          file "$RUNNER_TEMP/Payload/Frontline.app/Frontline"
          lipo -info "$RUNNER_TEMP/Payload/Frontline.app/Frontline"
          plutil -lint "$RUNNER_TEMP/Payload/Frontline.app/Info.plist"

      - name: 7. Загрузка артефакта Frontline-unsigned.ipa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Frontline-unsigned-ipa
          path: |
            ${{ runner.temp }}/Frontline-unsigned.ipa
            ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14

      - name: 8. Автоматическая публикация в GitHub Releases (прямая ссылка на .ipa)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ipa-v3.0-build-${{ github.run_number }}"
          gh release create "$TAG" "$RUNNER_TEMP/Frontline-unsigned.ipa" \
            --title "ФРОНТЛАЙН v3.0 — Неподписанный .IPA (Сборка #${{ github.run_number }})" \
            --notes "Готовый неподписанный файл **Frontline-unsigned.ipa** (v3.0 «Операция Ураган»: 20 стволов, 4 класса бойцов, 5 типов разрушаемых зданий, 4-фазная перезарядка, плавающий/статичный джойстик для всех экранов iPhone). Скачайте его ниже и подпишите своим сертификатом в Feather / ESign / Scarlet / AltStore." || true
